name: Feature Request
description: Suggest a new feature or enhancement for OmaPiP
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Describe the problem and proposed behavior. Sanitize screenshots and remove private window contents or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What use case does it address?
      placeholder: "I want to..."
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed Behavior
      description: How should the feature work? Describe the user-facing behavior.
      placeholder: "Add a button that..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought of? Why is this the best fit?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, related issues, or anything else relevant.
    validations:
      required: false
