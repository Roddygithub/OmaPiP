name: Bug Report
description: Report a bug in OmaPiP
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: omarchy-version
    attributes:
      label: Omarchy Version
      description: Output of `omarchy --version` or channel/branch
      placeholder: "e.g., 2024.09 / stable"
    validations:
      required: true
  - type: input
    id: hyprland-version
    attributes:
      label: Hyprland Version
      description: Output of `hyprctl version`
      placeholder: "e.g., 0.45.0"
    validations:
      required: true
  - type: input
    id: quickshell-version
    attributes:
      label: Quickshell Version
      description: Output of `quickshell --version` or commit
      placeholder: "e.g., 0.14.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Clear, numbered steps to reproduce the issue
      placeholder: |
        1. Open OmaPiP from bar
        2. Select a window
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant logs, `hyprctl` output, or shell errors (if any)
      render: shell
    validations:
      required: false
  - type: dropdown
    id: multi-monitor
    attributes:
      label: Multi-Monitor Setup
      description: Are you using multiple monitors?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: dpi
    attributes:
      label: Mixed DPI
      description: Are monitors running at different scale factors?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
