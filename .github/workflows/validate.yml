name: validate

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and whitespace
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("manifest.json"))
          assert m["schemaVersion"] == 1
          assert m["id"] == "io.github.roddygithub.omapip"
          assert m["version"] == "0.1.2"
          assert m["entryPoints"]["barWidget"] == "BarWidget.qml"
          assert m["kinds"] == ["bar-widget"]
          PY
          git diff --check
