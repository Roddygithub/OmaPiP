name: validate

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and whitespace
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("manifest.json"))
          assert m["schemaVersion"] == 1
          assert m["id"] == "io.github.roddygithub.omapip"
          assert m["version"] == "0.1.2"
          assert m["entryPoints"]["barWidget"] == "BarWidget.qml"
          assert m["kinds"] == ["bar-widget"]
          PY
          git diff --check

  display-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run display tests
        run: node tests/test_display.js
      - name: Run Phase A contract tests
        run: node tests/test_phase_a.js
      - name: Run Phase C picker keyboard tests
        run: node tests/test_phase_c.js

  qml-logic-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt QML test runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            qt6-declarative-dev-tools \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window
      - name: Run shared QML logic tests
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input tests/qml
